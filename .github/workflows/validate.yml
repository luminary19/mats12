name: validate
on:
  push:
  pull_request:
jobs:
  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell files
        shell: powershell
        run: |
          $errors = @()
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors)
            $errors += $parseErrors
          }
          if ($errors.Count) { $errors | Format-List | Out-String | Write-Error; exit 1 }
      - name: Run focused REST v2 tests
        shell: powershell
        run: ./tests/test_runpod_v2.ps1
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and test heartbeat
        run: |
          python -m py_compile runpod-side/*.py
          python -m unittest tests/test_heartbeat.py
